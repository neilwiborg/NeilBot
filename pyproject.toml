[project]
name = "NeilBot"
version = "0.0.1"
description = "A Discord bot made by Neil."
authors = [{ name = "Neil Wiborg", email = "NeilWiborg@outlook.com" }]
license = "GPL-3.0-only"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "py-cord[voice]==2.8.0",
    "python-dotenv==1.2.2",
    "validators==0.35.0",
    "apscheduler==3.11.2",
    "pymongo==4.17.0",
    "yt-dlp==2026.6.9",
    "aiohttp==3.14.1",
]

[dependency-groups]
dev = [
    "ruff==0.15.20",
    "mypy==2.1.0",
    "vulture==2.16",
    "codespell==2.4.2",
    "pre-commit==4.6.0",
]

[build-system]
requires = ["poetry-core==2.4.1"]
build-backend = "poetry.core.masonry.api"

[project.scripts]
neilbot = "main:main"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.14"
warn_redundant_casts = true
warn_no_return = true
warn_unreachable = true
warn_unused_configs = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "yt_dlp"
ignore_missing_imports = true

[tool.vulture]
ignore_decorators = [
    "@discord.slash_command",
    "@discord.ui.button",
    "@commands.Cog.listener",
]
ignore_names = ["setup", "on_ready"]
paths = ["neilbot"]
