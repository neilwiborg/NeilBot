[project]
name = "NeilBot"
version = "0.0.1"
description = "A Discord bot made by Neil."
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"

[tool.poetry]
name = "NeilBot"
version = "0.0.1"
description = "A Discord bot made by Neil."
license = "GPL-3.0-only"
authors = ["Neil Wiborg <NeilWiborg@outlook.com>"]

[tool.poetry.scripts]
neilbot = "main:main"

[tool.poetry.dependencies]
python = "^3.10"
py-cord = { extras = ["voice"], version = "^2.6.1" }
python-dotenv = "^1.1.0"
validators = "^0.34.0"
apscheduler = "^3.11.0"
pymongo = { extras = ["srv"], version = "^4.11.3" }
yt-dlp = "^2025.3.27"
aiohttp = "^3.11.14"

[tool.poetry.group.dev.dependencies]
pyupgrade = "^3.19.1"
autoflake = "^2.3.1"
isort = "^6.0.1"
flake8 = "^7.2.0"
flake8-pyproject = "^1.2.3"
mccabe = "^0.7.0"
mypy = "^1.15.0"
vulture = "^2.14"
codespell = "^2.4.1"
pre-commit = "^4.2.0"
black = "^25.1.0"

[tool.black]
target-version = ["py310"]
line-length = 88

[tool.flake8]
ignore = ["E203", "W503"]
max-line-length = 88
max-complexity = 10

[tool.isort]
profile = "black"
skip_gitignore = true
line_length = 88

[tool.mypy]
python_version = "3.10"
warn_redundant_casts = true
warn_no_return = true
warn_unreachable = true
warn_unused_configs = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "yt_dlp"
ignore_missing_imports = true

[tool.vulture]
ignore_decorators = [
    "@discord.slash_command",
    "@discord.ui.button",
    "@commands.Cog.listener",
]
ignore_names = ["setup", "on_ready"]
paths = ["neilbot"]
